name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/assets/png/spellbookmegapack/spellbookmegapack
          cp index.html game.js styles.css _site/
          cp -R assets/png/spellbookmegapack/spellbookmegapack/Flat_Skills_Icons _site/assets/png/spellbookmegapack/spellbookmegapack/
          cp -R assets/png/mobsavataricons assets/png/rpgclassbadges assets/png/potionicons assets/png/actionrpgloot _site/assets/png/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
